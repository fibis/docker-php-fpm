---

# Republish images that a green "🏠 Build" run already built and tested (its artifacts)
# to ghcr.io/<owner>/php-fpm, as multi-arch tags named like upstream: <ver>-<stage>[-<release>]
name: 📦 Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of a green "🏠 Build" run (artifacts are kept 90 days)'
        required: true
      release:
        description: 'Release suffix for the versioned tags, e.g. 0.161'
        required: true
      versions:
        description: 'JSON list of PHP versions to publish'
        default: '["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]'

permissions:
  actions: read
  contents: read
  packages: write

env:
  RUN_ID: ${{ inputs.run_id }}
  RELEASE: ${{ inputs.release }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/php-fpm

jobs:
  publish:
    name: PHP-${{ matrix.version }}-${{ matrix.stage }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # GHCR allows 2000 requests/minute; 35 parallel pushes hit 'toomanyrequests'
      max-parallel: 4
      matrix:
        version: ${{ fromJson(inputs.versions) }}
        stage: [base, mods, prod, slim, work]
    steps:
      - name: Download tested images (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ matrix.version }}-linux-*-${{ matrix.stage }}'
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: art

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push per-arch images and multi-arch tags
        env:
          VERSION: ${{ matrix.version }}
          STAGE: ${{ matrix.stage }}
        run: |
          set -eu
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "Retry ${i}/5: $*"; sleep $(( i * 30 )); done; return 1; }
          TAG="${VERSION}-${STAGE}"
          REFS=""
          for ARCH in amd64 arm64; do
            FILE="$( ls art/*-"${VERSION}"-linux-"${ARCH}"-"${STAGE}"/* )"
            SRC="$( docker load -i "${FILE}" | sed -n 's/^Loaded image: //p' | head -1 )"
            DST="${IMAGE}:${TAG}-${RELEASE}-linux-${ARCH}"
            docker tag "${SRC}" "${DST}"
            retry docker push "${DST}"
            docker rmi "${SRC}" "${DST}" >/dev/null
            REFS="${REFS} ${DST}"
          done
          retry docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}-${RELEASE}" \
            --tag "${IMAGE}:${TAG}" \
            ${REFS}
          docker buildx imagetools inspect "${IMAGE}:${TAG}-${RELEASE}"
