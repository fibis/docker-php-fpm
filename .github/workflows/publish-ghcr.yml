---

# Republish images that a green "🏠 Build" run already built and tested (its artifacts)
# to ghcr.io/<owner>/php-fpm, as multi-arch tags named like upstream: <ver>-<stage>[-<release>]
name: 📦 Publish to GHCR

on:
  push:
    branches:
      - ghcr-publish
    paths:
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of a green "🏠 Build" run (artifacts are kept 90 days)'
        required: true
      release:
        description: 'Release suffix for the versioned tags, e.g. 0.161'
        required: true

permissions:
  actions: read
  contents: read
  packages: write

env:
  # Defaults for the push trigger
  RUN_ID: ${{ inputs.run_id || '40926752040' }}
  RELEASE: ${{ inputs.release || '0.161' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/php-fpm

jobs:
  publish:
    name: PHP-${{ matrix.version }}-${{ matrix.stage }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        stage: [base, mods, prod, slim, work]
    steps:
      - name: Download tested images (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ matrix.version }}-linux-*-${{ matrix.stage }}'
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: art

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push per-arch images and multi-arch tags
        env:
          VERSION: ${{ matrix.version }}
          STAGE: ${{ matrix.stage }}
        run: |
          set -eu
          TAG="${VERSION}-${STAGE}"
          REFS=""
          for ARCH in amd64 arm64; do
            FILE="$( ls art/*-"${VERSION}"-linux-"${ARCH}"-"${STAGE}"/* )"
            SRC="$( docker load -i "${FILE}" | sed -n 's/^Loaded image: //p' | head -1 )"
            DST="${IMAGE}:${TAG}-${RELEASE}-linux-${ARCH}"
            docker tag "${SRC}" "${DST}"
            docker push "${DST}"
            docker rmi "${SRC}" "${DST}" >/dev/null
            REFS="${REFS} ${DST}"
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=PHP ${VERSION} FPM (${STAGE}) for devilbox, built and tested by run ${RUN_ID}" \
            --tag "${IMAGE}:${TAG}-${RELEASE}" \
            --tag "${IMAGE}:${TAG}" \
            ${REFS}
          docker buildx imagetools inspect "${IMAGE}:${TAG}-${RELEASE}"
