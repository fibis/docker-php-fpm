---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions


all:
  type: pecl
  build_dep: [unixodbc-dev]
  run_dep: [unixodbc]

# 5.13.x requires PHP >= 8.3
8.2:
  type: pecl
  version: 5.12.0

8.1:
  type: pecl
  version: 5.12.0

8.0:
  type: pecl
  version: 5.11.1

7.4:
  type: pecl
  version: 5.10.1

7.3:
  type: pecl
  version: 5.9.0

7.2:
  type: pecl
  version: 5.8.1

7.1:
  type: pecl
  version: 5.6.1

7.0:
  type: pecl
  version: 5.3.0

# PHP 8.6: https://github.com/microsoft/msphpsql/commit/4bf7dc0e29af7c2a61b0fecfc69b223507c62f86
8.6:
  type: git
  git_url: https://github.com/microsoft/msphpsql
  git_ref: 4bf7dc0e29af7c2a61b0fecfc69b223507c62f86
  command: cp -r source/shared source/sqlsrv/ && cd source/sqlsrv && phpize && ./configure && make -j$(getconf _NPROCESSORS_ONLN) && make install
