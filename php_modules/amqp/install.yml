  type: pecl
  version: 1.11.0

7.0:
  type: pecl
  version: 1.11.0

5.6:
  type: pecl
  version: 1.11.0

# PHP 8.6: https://github.com/php-amqp/php-amqp/pull/638
8.6:
  type: git
  git_url: https://github.com/remicollet/php-amqp
