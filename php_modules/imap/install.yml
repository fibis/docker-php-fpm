---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions


all:
  type: builtin
  pre: ln -s /usr/lib/$(dpkg-architecture --query DEB_BUILD_GNU_TYPE)/libkrb5* /usr/lib/
  configure: --with-kerberos --with-imap-ssl --with-imap
  build_dep: [libc-client-dev, libkrb5-dev, libcurl4-openssl-dev]
  run_dep: [libc-client2007e]

# PHP 8.6: https://github.com/php/pecl-mail-imap/pull/23
8.6:
  type: git
  git_url: https://github.com/php/pecl-mail-imap
  git_ref: c441c79add125f5a01f88332805221edeebe47b0
  configure: --with-imap --with-kerberos --with-imap-ssl

8.5:
  type: pecl
  version: 1.0.3

8.4:
  type: pecl
  version: 1.0.3
