---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions


all:
  type: pecl
  build_dep: [zlib1g-dev]
  run_dep: []

# PHP 8.6: https://github.com/viest/php-ext-xlswriter/commit/6d6a04dacfb552a66baef7b3f7cddda8962f6344
8.6:
  type: git
  git_url: https://github.com/viest/php-ext-xlswriter
  git_ref: 6d6a04dacfb552a66baef7b3f7cddda8962f6344
  command: git submodule update --init && phpize && ./configure && make -j$(getconf _NPROCESSORS_ONLN) && make install
