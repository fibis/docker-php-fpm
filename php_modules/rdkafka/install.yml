---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions


all:
  type: pecl
  build_dep: [librdkafka-dev]
  run_dep: [librdkafka1]

7.0:
  type: pecl
  version: 3.1.2

5.6:
  type: pecl
  version: 3.1.2

# PHP 8.6: https://github.com/php-rdkafka/php-rdkafka
8.6:
  type: git
  git_url: https://github.com/php-rdkafka/php-rdkafka
  git_ref: 34348cd8517e0ffa85d013117fb6e4ac6da5c709
  configure: --with-rdkafka
